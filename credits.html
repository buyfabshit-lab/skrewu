<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Credits · The Machine</title>
<meta name="description" content="What the AI tools cost to run, and how to top up."/>
<style>
:root{
  --void:#0a0908; --void-2:#12100d; --panel:#17130e; --bone:#e8e2d4; --bone-dim:#a49c8d;
  --acid:#c4f135; --ember:#ff8a3d; --rust:#d8402f; --iron:#3a3530; --iron-2:#4b453d;
  --disp:'Arial Narrow','Helvetica Neue',sans-serif; --body:'Courier New',ui-monospace,Menlo,monospace;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:
    radial-gradient(900px 420px at 82% -6%, rgba(196,241,53,.06), transparent 60%),
    var(--void);
  color:var(--bone);font-family:var(--body);font-size:15px;line-height:1.6;min-height:100dvh;}
h1,h2,h3{font-family:var(--disp);text-transform:uppercase;font-weight:700;letter-spacing:.02em;line-height:1;}
a{color:inherit;text-decoration:none;} button{font-family:var(--body);cursor:pointer;}
.wrap{max-width:900px;margin:0 auto;padding:0 20px 90px;}

.top{display:flex;align-items:center;gap:12px;height:54px;padding:0 20px;border-bottom:1px solid var(--iron);}
.top .mark{font-family:var(--disp);letter-spacing:.14em;font-size:14px;text-transform:uppercase;}
.top .mark b{color:var(--acid);}
.top .lk{margin-left:auto;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--bone-dim);}
.top .lk:hover{color:var(--acid);}

/* the balance */
.bal{margin-top:34px;border:1px solid var(--iron);background:linear-gradient(180deg,var(--panel),var(--void-2));
  padding:26px 24px;display:flex;align-items:center;gap:26px;flex-wrap:wrap;}
.bal .big{font-family:var(--disp);font-size:clamp(46px,11vw,80px);line-height:.9;color:var(--acid);}
.bal .lbl{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--bone-dim);margin-top:8px;}
.bal .who{margin-left:auto;text-align:right;}
.bal .who b{font-family:var(--disp);font-size:19px;letter-spacing:.05em;display:block;}
.bal .who span{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--bone-dim);}
.bal.low .big{color:var(--ember);}

/* what a run costs */
.rates{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-top:14px;}
.rate{border:1px solid var(--iron);background:var(--void-2);padding:13px 15px;}
.rate .n{font-family:var(--disp);font-size:22px;color:var(--acid);}
.rate .w{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--bone-dim);margin-top:4px;}

section{margin-top:40px;}
.sec-head h2{font-size:clamp(22px,4vw,30px);}
.sec-head p{color:var(--bone-dim);font-size:13.5px;margin-top:6px;max-width:56ch;}

.packs{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px;margin-top:20px;}
.pack{border:1px solid var(--iron);background:linear-gradient(180deg,var(--panel),var(--void-2));
  padding:20px 18px;display:flex;flex-direction:column;gap:10px;position:relative;}
.pack:hover{border-color:var(--iron-2);}
.pack.best{border-color:var(--acid);}
.pack .save{position:absolute;top:0;right:0;background:var(--acid);color:var(--void);font-size:9px;
  font-weight:700;letter-spacing:.12em;text-transform:uppercase;padding:4px 9px;}
.pack .cr{font-family:var(--disp);font-size:30px;line-height:1;}
.pack .cr small{display:block;font-family:var(--body);font-size:9.5px;letter-spacing:.14em;
  text-transform:uppercase;color:var(--bone-dim);margin-top:5px;}
.pack .amt{font-size:22px;font-family:var(--disp);color:var(--acid);}
.pack .per{font-size:10px;letter-spacing:.08em;color:var(--iron-2);}
.pack button{margin-top:auto;background:var(--acid);border:1px solid var(--acid);color:var(--void);
  font-family:var(--disp);text-transform:uppercase;letter-spacing:.08em;font-size:13px;padding:11px;}
.pack button:disabled{opacity:.5;cursor:default;}

.note{margin-top:16px;color:var(--iron-2);font-size:11.5px;letter-spacing:.04em;}
.note.bad{color:var(--ember);}

/* the ledger */
.ledger{margin-top:18px;border:1px solid var(--iron);}
.ledger .r{display:flex;align-items:center;gap:12px;padding:11px 14px;border-bottom:1px solid #16130f;font-size:13px;}
.ledger .r:last-child{border-bottom:none;}
.ledger .r .d{color:var(--bone-dim);flex:1;}
.ledger .r .t{font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--iron-2);}
.ledger .r .a{font-family:var(--disp);font-size:17px;}
.ledger .r .a.pos{color:var(--acid);} .ledger .r .a.neg{color:var(--bone-dim);}
.empty{padding:22px;text-align:center;color:var(--iron-2);font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;}

.paid{margin-top:26px;border:1px solid var(--acid);background:linear-gradient(180deg,rgba(196,241,53,.08),transparent);
  padding:18px 20px;display:flex;gap:14px;align-items:flex-start;}
.paid .m{font-family:var(--disp);font-size:24px;color:var(--acid);line-height:1;}
.paid h3{font-family:var(--disp);text-transform:uppercase;font-size:16px;}
.paid p{color:var(--bone-dim);font-size:13px;margin-top:5px;}

.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(18px);background:var(--rust);
  color:#fff;font-family:var(--disp);text-transform:uppercase;letter-spacing:.06em;font-size:13px;
  padding:12px 20px;opacity:0;pointer-events:none;transition:.22s;z-index:60;max-width:92vw;text-align:center;}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
</style>
</head>
<body data-page="Credits">

<div class="top">
  <span class="mark" data-brand="Credits">Credits</span>
  <a class="lk" href="hub.html">The machine →</a>
</div>

<main class="wrap">
  <div id="paidNote"></div>

  <div class="bal" id="bal">
    <div>
      <div class="big" id="balance">—</div>
      <div class="lbl">Credits on hand</div>
    </div>
    <div class="who"><b id="shopName">…</b><span id="usedLine"></span></div>
  </div>

  <div class="rates" id="rates"></div>

  <section>
    <div class="sec-head">
      <h2>Top up</h2>
      <p>Credits don't expire and they're not a subscription. Buy what you need, spend it when you want.</p>
    </div>
    <div class="packs" id="packs"></div>
    <p class="note" id="note"></p>
  </section>

  <section>
    <div class="sec-head"><h2>Every movement</h2>
      <p>Bought, spent, put back — with the balance after each one.</p></div>
    <div class="ledger" id="ledger"><div class="empty">Loading…</div></div>
  </section>
</main>

<div class="toast" id="toast"></div>
<script src="credits.js"></script>
<script src="theme.js"></script>
</body>
</html>
