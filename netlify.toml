# One repository feeds two Netlify projects.
#
# Netlify provides SITE_ID and SITE_NAME during every build. The build script
# uses those stable values to stage either:
#   - the public SKREWU community plus the two signature-verified webhooks, or
#   - the private staff tools plus their full API and tools library.
#
# The generated directory is disposable and never committed.
[build]
  command = "node scripts/build-netlify-site.mjs"
  publish = ".skrewu-deploy"

[functions]
  directory = ".skrewu-deploy/netlify/functions"
  node_bundler = "esbuild"
  included_files = [
    ".skrewu-deploy/products.json",
    ".skrewu-deploy/packs.json"
  ]

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200
