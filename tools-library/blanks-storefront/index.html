<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Blanks</title>
<meta name="description" content="Pick a blank, then design it. Live catalog from S&S Activewear."/>
<style>
:root{
  --bg:#f6f7f9;
  --surface:#ffffff;
  --ink:#12161d;
  --muted:#5b6472;
  --dim:#8a93a3;
  --line:#e6e9ef;
  --line-2:#d7dce4;
  --accent:#6d5bef;
  --accent-2:#5a49dd;
  --accent-ink:#ffffff;
  --shadow:0 1px 2px rgba(16,22,34,.06),0 8px 24px rgba(16,22,34,.06);
  --sans:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root{--bg:#0c0f16;--surface:#141922;--ink:#eef1f6;--muted:#a7b0be;--dim:#6c7686;--line:#232b38;--line-2:#2c3644;--shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.35);}
}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;}
button{font-family:inherit;cursor:pointer;color:inherit;background:none;border:none;}
input{font-family:inherit;color:inherit;}
img{max-width:100%;display:block;}
a{color:inherit;text-decoration:none;}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
.wrap{max-width:1200px;margin:0 auto;padding:0 22px;}

header{position:sticky;top:0;z-index:30;background:color-mix(in srgb,var(--surface) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);}
.hrow{display:flex;align-items:center;gap:14px;height:60px;}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:16px;letter-spacing:-0.01em;}
.brand .logo{width:32px;height:32px;border-radius:9px;background:linear-gradient(135deg,var(--accent),var(--accent-2));display:grid;place-items:center;color:#fff;overflow:hidden;}
.brand .logo svg{width:18px;height:18px;}
.brand .sub{display:block;font-size:10px;font-weight:500;color:var(--dim);letter-spacing:.14em;text-transform:uppercase;margin-top:1px;}
.search{margin-left:auto;display:flex;align-items:center;gap:8px;background:var(--bg);border:1px solid var(--line-2);border-radius:10px;padding:8px 12px;min-width:min(360px,42vw);}
.search svg{width:15px;height:15px;color:var(--dim);flex-shrink:0;}
.search input{flex:1;border:none;background:none;font-size:13.5px;}

.hero{padding:30px 0 10px;}
.hero h1{font-size:clamp(24px,3.2vw,34px);letter-spacing:-0.02em;font-weight:800;}
.hero p{color:var(--muted);margin-top:6px;}
.banner{margin:14px 0 0;padding:10px 14px;border:1px solid var(--line-2);background:var(--surface);border-radius:10px;font-size:12.5px;color:var(--muted);display:none;align-items:center;gap:9px;}
.banner.show{display:flex;}
.banner .dot{width:8px;height:8px;border-radius:50%;background:#f5a524;flex-shrink:0;}

.meta-row{display:flex;align-items:baseline;justify-content:space-between;margin:22px 0 12px;}
.meta-row h2{font-size:15px;font-weight:700;}
.meta-row .count{color:var(--dim);font-size:12.5px;}

.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;padding-bottom:60px;}
@media(max-width:1000px){.grid{grid-template-columns:repeat(3,1fr);}}
@media(max-width:720px){.grid{grid-template-columns:repeat(2,1fr);}}
@media(max-width:460px){.grid{grid-template-columns:1fr;}}

.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column;transition:transform .15s,box-shadow .15s,border-color .15s;}
.card:hover{transform:translateY(-2px);box-shadow:var(--shadow);border-color:var(--line-2);}
.thumb{aspect-ratio:1/1;background:var(--bg);display:grid;place-items:center;overflow:hidden;position:relative;}
.thumb img{width:100%;height:100%;object-fit:contain;padding:10px;}
.thumb .ph{display:flex;flex-direction:column;align-items:center;gap:8px;color:var(--dim);}
.thumb .ph svg{width:40px;height:40px;opacity:.5;}
.thumb .ph .pn{font-weight:700;font-size:13px;color:var(--muted);}
.cat{position:absolute;top:10px;left:10px;background:color-mix(in srgb,var(--surface) 85%,transparent);border:1px solid var(--line-2);border-radius:999px;padding:3px 9px;font-size:10.5px;color:var(--muted);font-weight:600;}
.cbody{padding:12px 13px 13px;display:flex;flex-direction:column;gap:10px;flex:1;}
.cbrand{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--dim);font-weight:700;}
.cname{font-weight:700;font-size:14px;line-height:1.25;margin-top:-4px;}
.cname .style{color:var(--muted);font-weight:600;}
.design-btn{margin-top:auto;width:100%;padding:10px;border-radius:10px;font-size:13px;font-weight:700;color:var(--accent-ink);background:linear-gradient(180deg,var(--accent),var(--accent-2));border:1px solid var(--accent-2);transition:filter .15s,transform .08s;}
.design-btn:hover{filter:brightness(1.05);}
.design-btn:active{transform:translateY(1px);}

.empty,.loading{grid-column:1/-1;padding:50px 20px;text-align:center;color:var(--dim);}
.spinner{width:22px;height:22px;border:3px solid var(--line-2);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 12px;}
@keyframes spin{to{transform:rotate(360deg);}}

footer{border-top:1px solid var(--line);padding:22px 0;color:var(--dim);font-size:12px;text-align:center;}

.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(16px);background:var(--ink);color:var(--bg);border-radius:10px;padding:11px 16px;font-size:12.5px;box-shadow:var(--shadow);opacity:0;pointer-events:none;transition:all .22s;z-index:100;max-width:90vw;}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
</style>
</head>
<body>
<header>
  <div class="wrap hrow">
    <div class="brand">
      <span class="logo" id="brandLogo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3l6 3 6-3 3 5-4 2v9H7v-9L3 8z"/></svg></span>
      <span><span id="brandName">Blanks</span><span class="sub" id="brandTagline">Pick a blank · design it</span></span>
    </div>
    <label class="search">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
      <input id="search" type="text" placeholder="Search brand or style…"/>
    </label>
  </div>
</header>

<main class="wrap">
  <section class="hero">
    <h1 id="heroTitle">Choose your blank</h1>
    <p id="heroSub">Every blank below is live from the catalog. Pick one and jump straight into the designer.</p>
    <div class="banner" id="banner"><span class="dot"></span><span id="bannerMsg"></span></div>
  </section>

  <div class="meta-row">
    <h2>Catalog</h2>
    <span class="count" id="count">Loading…</span>
  </div>
  <div class="grid" id="grid">
    <div class="loading"><div class="spinner"></div>Loading blanks…</div>
  </div>
</main>

<footer class="wrap"><span id="footBrand">Blanks</span> · catalog via ss-products</footer>
<div class="toast" id="toast"></div>

<template id="cardTpl">
  <article class="card" data-card>
    <div class="thumb" data-thumb>
      <span class="cat" data-cat></span>
      <div class="ph" data-ph><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M6 3l6 3 6-3 3 5-4 2v9H7v-9L3 8z"/></svg><span class="pn" data-pn></span></div>
    </div>
    <div class="cbody">
      <div>
        <div class="cbrand" data-brand></div>
        <div class="cname" data-name></div>
      </div>
      <button class="design-btn" data-design>Design this blank</button>
    </div>
  </article>
</template>

<script src="app.js"></script>
</body>
</html>
