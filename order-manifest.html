:root{
  --void:#0a0908;
  --void-2:#13110f;
  --void-3:#1b1815;
  --bone:#e8e2d4;
  --bone-dim:#a8a194;
  --rust:#a32a1f;
  --rust-bright:#c43a2c;
  --acid:#c4f135;
  --iron:#3a3530;
  --iron-light:#56504a;
  --ember:#ff6b35;

  --display:'Death Corps Pro','Arial Narrow','Helvetica Neue',sans-serif;
  --body:'Courier New',ui-monospace,'SF Mono',Menlo,monospace;
}
*{box-sizing:border-box;margin:0;padding:0;}
html{scroll-behavior:smooth;}
body{
  background:var(--void);
  color:var(--bone);
  font-family:var(--body);
  font-size:15px;line-height:1.6;
  -webkit-font-smoothing:antialiased;
  background-image:
    repeating-linear-gradient(0deg,transparent,transparent 39px,rgba(58,53,48,0.14) 39px,rgba(58,53,48,0.14) 40px);
  min-height:100vh;
}
@media (prefers-reduced-motion:reduce){
  *{animation-duration:.01ms!important;transition-duration:.01ms!important;scroll-behavior:auto!important;}
}
h1,h2,h3,h4{font-family:var(--display);text-transform:uppercase;letter-spacing:.02em;font-weight:700;line-height:1.02;}
button{font-family:var(--body);cursor:pointer;color:inherit;}
img{max-width:100%;display:block;}
:focus-visible{outline:3px solid var(--acid);outline-offset:2px;}
.wrap{max-width:940px;margin:0 auto;padding:0 20px;}

/* ============ TOP BAR ============ */
#topbar{
  position:sticky;top:0;z-index:50;
  background:rgba(10,9,8,.9);backdrop-filter:blur(7px);
  border-bottom:1px solid var(--iron);
}
#topbar .barrow{display:flex;align-items:center;justify-content:space-between;height:60px;}
.brand{display:flex;align-items:center;gap:11px;font-family:var(--display);font-size:17px;letter-spacing:.06em;text-transform:uppercase;}
.brand .glyph{
  width:30px;height:30px;flex-shrink:0;border:1px solid var(--rust-bright);
  background:var(--rust);display:grid;place-items:center;color:var(--bone);font-size:15px;
  transform:skewX(-6deg);
}
.brand .b-sub{font-size:8.5px;color:var(--bone-dim);letter-spacing:.2em;display:block;text-transform:uppercase;margin-top:1px;}
.bar-right{display:flex;align-items:center;gap:14px;color:var(--bone-dim);font-size:11px;letter-spacing:.14em;text-transform:uppercase;}
.bar-right .live-dot{width:7px;height:7px;background:var(--acid);border-radius:50%;display:inline-block;margin-right:6px;box-shadow:0 0 8px var(--acid);animation:pulse 2s infinite;}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}

/* ============ PAGE HEAD ============ */
.pagehead{padding:44px 0 26px;}
.eyebrow{font-size:11px;letter-spacing:.28em;color:var(--rust-bright);text-transform:uppercase;display:block;margin-bottom:14px;}
.pagehead h1{font-size:clamp(38px,6.5vw,60px);color:var(--bone);}
.pagehead h1 .em{color:var(--acid);}
.pagehead p{color:var(--bone-dim);font-size:14px;margin-top:14px;max-width:520px;}

/* ============ TABS ============ */
.tabrow{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px;}
.tab{
  background:var(--void-2);border:1px solid var(--iron);
  padding:11px 16px;font-size:12px;text-transform:uppercase;letter-spacing:.12em;color:var(--bone-dim);
  display:inline-flex;align-items:center;gap:10px;transition:border-color .18s,color .18s,background .18s;
}
.tab:hover{border-color:var(--iron-light);color:var(--bone);}
.tab .count{
  font-family:var(--display);font-size:14px;line-height:1;padding:3px 7px 2px;
  background:var(--void-3);border:1px solid var(--iron);color:var(--bone-dim);
}
.tab.on{background:var(--acid);border-color:var(--acid);color:var(--void);}
.tab.on .count{background:rgba(10,9,8,.18);border-color:transparent;color:var(--void);}

/* ============ SEARCH ============ */
.searchbar{position:relative;margin-bottom:26px;}
.searchbar svg{position:absolute;left:16px;top:50%;transform:translateY(-50%);width:16px;height:16px;stroke:var(--bone-dim);}
.searchbar input{
  width:100%;background:var(--void-2);border:1px solid var(--iron);color:var(--bone);
  font-family:var(--body);font-size:14px;padding:15px 16px 15px 44px;letter-spacing:.02em;
}
.searchbar input::placeholder{color:var(--iron-light);}
.searchbar input:focus{border-color:var(--acid);outline:none;}

/* ============ ORDER CARD ============ */
.manifest{display:flex;flex-direction:column;gap:18px;padding-bottom:80px;}
.order{
  background:var(--void-2);border:1px solid var(--iron);
  transition:border-color .2s,transform .2s;position:relative;
}
.order::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--iron);transition:background .2s;}
.order:hover{border-color:var(--iron-light);}
.order.s-processed::before{background:var(--ember);}
.order.s-shipped::before{background:var(--acid);}
.order.s-delivered::before{background:var(--rust-bright);}

.o-head{display:flex;align-items:center;justify-content:space-between;padding:18px 22px;gap:14px;flex-wrap:wrap;}
.o-id{display:flex;align-items:center;gap:13px;}
.o-icon{
  width:40px;height:40px;flex-shrink:0;border:1px solid var(--iron);background:var(--void-3);
  display:grid;place-items:center;color:var(--bone-dim);
}
.o-shipped .o-icon{color:var(--acid);border-color:rgba(196,241,53,.4);}
.o-icon svg{width:20px;height:20px;}
.o-id h3{font-size:21px;color:var(--bone);letter-spacing:.03em;}
.o-id .o-date{font-size:11.5px;color:var(--bone-dim);letter-spacing:.04em;text-transform:uppercase;margin-top:2px;}

.pill{font-family:var(--display);font-size:11px;letter-spacing:.1em;text-transform:uppercase;padding:7px 13px;display:inline-flex;align-items:center;gap:7px;border:1px solid;}
.pill svg{width:13px;height:13px;}
.pill.processed{color:var(--ember);border-color:rgba(255,107,53,.5);background:rgba(255,107,53,.08);}
.pill.shipped{color:var(--acid);border-color:rgba(196,241,53,.5);background:rgba(196,241,53,.07);}
.pill.delivered{color:var(--void);border-color:var(--rust-bright);background:var(--rust-bright);}

.hr{height:1px;background:var(--iron);margin:0 22px;}
.hr.dash{background:none;border-top:1px dashed var(--iron);height:0;}

/* party grid */
.o-party{display:grid;grid-template-columns:1.2fr 1fr;gap:26px;padding:20px 22px;}
.pcol .plabel{font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--rust-bright);margin-bottom:12px;}
.cust-line{display:flex;align-items:center;gap:10px;margin-bottom:7px;font-size:13.5px;color:var(--bone);}
.cust-line svg{width:15px;height:15px;stroke:var(--bone-dim);flex-shrink:0;}
.cust-line.name{font-weight:700;font-size:15px;}
.cust-line.dim{color:var(--bone-dim);}
.addr{font-size:13.5px;color:var(--bone);line-height:1.7;}
.addr .who{font-weight:700;}

/* shipping grid */
.o-ship{display:grid;grid-template-columns:1fr 1.3fr .8fr;gap:22px;padding:20px 22px;}
.scol .plabel{font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--bone-dim);margin-bottom:9px;}
.scol .sval{font-size:14px;color:var(--bone);}
.scol .ssub{font-size:11.5px;color:var(--bone-dim);margin-top:3px;letter-spacing:.03em;}
.track{
  font-size:15px;color:var(--acid);letter-spacing:.04em;word-break:break-all;
  display:inline-flex;align-items:baseline;gap:0;cursor:pointer;background:none;border:none;text-align:left;padding:0;
}
.track:hover{text-decoration:underline;}
.copy-hint{display:block;font-size:10.5px;color:var(--bone-dim);letter-spacing:.08em;text-transform:uppercase;margin-top:5px;}
.copy-hint.done{color:var(--acid);}
.carrier{display:inline-flex;align-items:center;gap:9px;}
.carrier .badge{
  width:34px;height:34px;flex-shrink:0;border:1px solid var(--iron);background:var(--void);
  display:grid;place-items:center;font-family:var(--display);font-size:11px;letter-spacing:.02em;color:var(--bone);
}
.carrier .badge.usps{color:#3c6ec9;border-color:rgba(60,110,201,.5);}
.carrier .badge.ups{color:#f6a800;border-color:rgba(246,168,0,.5);}
.carrier .badge.fedex{color:#7c4dff;border-color:rgba(124,77,255,.5);}
.carrier .cname{font-size:13px;color:var(--bone);}

/* footer */
.o-foot{display:flex;align-items:center;justify-content:space-between;padding:18px 22px;gap:16px;}
.items-wrap{display:flex;align-items:center;gap:14px;}
.items-wrap .plabel{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--bone-dim);}
.thumbs{display:flex;gap:8px;}
.thumb{
  width:44px;height:44px;border:1px solid var(--iron);background:var(--void-3);
  display:grid;place-items:center;font-family:var(--display);font-size:16px;color:var(--bone-dim);position:relative;overflow:hidden;
}
.thumb::after{content:'';position:absolute;inset:0;background:repeating-linear-gradient(-45deg,transparent,transparent 5px,rgba(232,226,212,.05) 5px,rgba(232,226,212,.05) 6px);}
.foot-right{display:flex;align-items:center;gap:20px;}
.total{text-align:right;}
.total .plabel{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--bone-dim);margin-bottom:2px;}
.total .amt{font-family:var(--display);font-size:24px;color:var(--acid);}
.expand-btn{
  width:38px;height:38px;border:1px solid var(--iron);background:var(--void);display:grid;place-items:center;
  transition:border-color .18s,background .18s;
}
.expand-btn:hover{border-color:var(--acid);}
.expand-btn svg{width:16px;height:16px;stroke:var(--bone);transition:transform .25s;}
.order.open .expand-btn svg{transform:rotate(90deg);}
.order.open .expand-btn{border-color:var(--acid);background:rgba(196,241,53,.06);}

/* detail (expandable) */
.o-detail{max-height:0;overflow:hidden;transition:max-height .35s ease;border-top:0 solid var(--iron);}
.order.open .o-detail{max-height:1200px;border-top:1px solid var(--iron);}
.detail-inner{padding:24px 22px 26px;background:var(--void);}
.detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:34px;}
.dtitle{font-family:var(--display);font-size:14px;letter-spacing:.08em;text-transform:uppercase;color:var(--bone);margin-bottom:18px;padding-bottom:10px;border-bottom:1px solid var(--iron);}

/* tracking timeline */
.timeline{list-style:none;position:relative;}
.timeline::before{content:'';position:absolute;left:8px;top:6px;bottom:14px;width:2px;background:var(--iron);}
.tl-step{position:relative;padding:0 0 22px 34px;}
.tl-step:last-child{padding-bottom:0;}
.tl-dot{position:absolute;left:0;top:2px;width:18px;height:18px;border:2px solid var(--iron);background:var(--void);border-radius:50%;z-index:2;}
.tl-step.done .tl-dot{border-color:var(--acid);background:var(--acid);box-shadow:0 0 9px rgba(196,241,53,.5);}
.tl-step.now .tl-dot{border-color:var(--acid);background:var(--void);animation:pulse 1.6s infinite;}
.tl-step.pending .tl-dot{border-style:dashed;}
.tl-head{font-size:14px;color:var(--bone);font-weight:700;letter-spacing:.02em;}
.tl-step.pending .tl-head{color:var(--iron-light);}
.tl-meta{font-size:11.5px;color:var(--bone-dim);margin-top:3px;letter-spacing:.03em;}
.tl-step.now .tl-head{color:var(--acid);}

/* line items */
.lineitem{display:flex;align-items:center;gap:14px;padding:12px 0;border-bottom:1px dashed var(--iron);}
.lineitem:last-of-type{border-bottom:none;}
.li-thumb{width:46px;height:46px;flex-shrink:0;border:1px solid var(--iron);background:var(--void-3);display:grid;place-items:center;font-family:var(--display);color:var(--bone-dim);font-size:17px;}
.li-info{flex:1;min-width:0;}
.li-name{font-size:13.5px;color:var(--bone);font-weight:700;}
.li-meta{font-size:11.5px;color:var(--bone-dim);margin-top:2px;letter-spacing:.03em;}
.li-price{font-size:14px;color:var(--bone);font-family:var(--display);letter-spacing:.02em;}
.li-totals{margin-top:16px;padding-top:14px;border-top:1px solid var(--iron);}
.li-totrow{display:flex;justify-content:space-between;font-size:13px;color:var(--bone-dim);padding:4px 0;}
.li-totrow.grand{color:var(--bone);font-size:15px;padding-top:10px;}
.li-totrow.grand b{font-family:var(--display);color:var(--acid);font-size:20px;font-weight:400;}

.empty{grid-column:1/-1;text-align:center;padding:70px 20px;border:1px dashed var(--iron);color:var(--bone-dim);}
.empty h3{color:var(--bone);font-size:20px;margin-bottom:8px;}

.footnote{text-align:center;color:var(--iron-light);font-size:11px;letter-spacing:.14em;text-transform:uppercase;padding:10px 0 50px;}

@media (max-width:720px){
  .o-party,.o-ship,.detail-grid{grid-template-columns:1fr;gap:18px;}
  .o-foot{flex-wrap:wrap;}
  .pagehead h1{font-size:40px;}
}
</style>
</head>
<body>

<header id="topbar"><div class="wrap barrow">
  <div class="brand">
    <span class="glyph">SU</span>
    <span>SKREW U<span class="b-sub">Fulfillment Console</span></span>
  </div>
  <div class="bar-right"><span><span class="live-dot"></span>Floor Live</span></div>
</div></header>

<main class="wrap">
  <div class="pagehead">
    <span class="eyebrow">Shipping &amp; Processing</span>
    <h1>The <span class="em">Manifest</span></h1>
    <p>Every order off the floor — processed, boxed, in transit, delivered. Track it, copy it, ship it.</p>
  </div>

  <div class="tabrow" id="tabrow">
    <button class="tab on" data-filter="all">All <span class="count" id="c-all">0</span></button>
    <button class="tab" data-filter="processed">Processed <span class="count" id="c-processed">0</span></button>
    <button class="tab" data-filter="shipped">Shipped <span class="count" id="c-shipped">0</span></button>
    <button class="tab" data-filter="delivered">Delivered <span class="count" id="c-delivered">0</span></button>
  </div>

  <div class="searchbar">
    <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
    <input id="search" type="text" placeholder="Search order #, name, email, or tracking #" autocomplete="off"/>
  </div>

  <div class="manifest" id="manifest"></div>
  <p class="footnote">SKREW U — nobody ships it but us · Session demo data</p>
</main>
<script>
/* ============ ICONS ============ */
const ICON = {
  truck:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M1 3h15v13H1z"/><path d="M16 8h4l3 3v5h-7z"/><circle cx="5.5" cy="18.5" r="2"/><circle cx="18.5" cy="18.5" r="2"/></svg>',
  box:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 8l-9-5-9 5v8l9 5 9-5z"/><path d="M3 8l9 5 9-5M12 13v8"/></svg>',
  check:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>',
  mail:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="1"/><path d="m2 6 10 7 10-7"/></svg>',
  phone:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3 19.5 19.5 0 0 1-6-6 19.8 19.8 0 0 1-3-8.6A2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .4 1.9.7 2.8a2 2 0 0 1-.5 2.1L8.1 9.9a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.8.7a2 2 0 0 1 1.7 2z"/></svg>',
  user:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>',
  chevron:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 6 15 12 9 18"/></svg>'
};

/* ============ SAMPLE DATA ============ */
const ORDERS = [
  {
    id:'10478', status:'shipped', date:'May 18, 2025 · 2:34 PM',
    name:'Jessica Martinez', email:'jessica.martinez@gmail.com', phone:'(555) 123-4567',
    ship:['1234 Maple St.','Los Angeles, CA 90001','United States'],
    method:'USPS Priority Mail', eta:'2–3 Business Days',
    tracking:'9400 1118 9956 1234 5678 90', carrier:'usps', carrierName:'USPS',
    items:[{n:'Floor Crew Tee',m:'Size L · Black',p:44.00,g:'T'},{n:'Death Corps Tote',m:'One Size · Bone',p:38.00,g:'B'}],
    ship1:9.99, total:89.99,
    timeline:[
      {h:'Order Placed',m:'May 16 · 9:12 AM',s:'done'},
      {h:'Processed & Packed',m:'May 17 · 4:40 PM',s:'done'},
      {h:'Shipped — In Transit',m:'May 18 · 2:34 PM · Los Angeles hub',s:'now'},
      {h:'Out for Delivery',m:'Pending',s:'pending'},
      {h:'Delivered',m:'Est. May 21',s:'pending'}
    ]
  },
  {
    id:'10477', status:'shipped', date:'May 18, 2025 · 11:02 AM',
    name:'Michael Johnson', email:'michael.johnson@gmail.com', phone:'(555) 987-6543',
    ship:['5678 Oak Avenue','Austin, TX 73301','United States'],
    method:'UPS Ground', eta:'3–5 Business Days',
    tracking:'1Z999AA10123456784', carrier:'ups', carrierName:'UPS',
    items:[{n:'Skrew Beanie',m:'One Size · Rust',p:42.00,g:'S'}],
    ship1:7.50, total:49.50,
    timeline:[
      {h:'Order Placed',m:'May 16 · 6:48 PM',s:'done'},
      {h:'Processed & Packed',m:'May 17 · 1:15 PM',s:'done'},
      {h:'Shipped — In Transit',m:'May 18 · 11:02 AM · Austin hub',s:'now'},
      {h:'Out for Delivery',m:'Pending',s:'pending'},
      {h:'Delivered',m:'Est. May 23',s:'pending'}
    ]
  },
  {
    id:'10476', status:'delivered', date:'May 17, 2025 · 8:20 AM',
    name:'Dana Okafor', email:'dana.okafor@gmail.com', phone:'(555) 442-1180',
    ship:['902 Industrial Way, Apt 4','Portland, OR 97201','United States'],
    method:'FedEx 2Day', eta:'2 Business Days',
    tracking:'7712 8890 4451', carrier:'fedex', carrierName:'FedEx',
    items:[{n:'Cyborg Capsule Hoodie',m:'Size M · Void',p:96.00,g:'C'},{n:'Zine Issue 03',m:'Print · Ltd',p:18.00,g:'Z'},{n:'Sticker Pack',m:'6-pc',p:9.00,g:'P'}],
    ship1:12.00, total:135.00,
    timeline:[
      {h:'Order Placed',m:'May 13 · 10:03 AM',s:'done'},
      {h:'Processed & Packed',m:'May 14 · 3:22 PM',s:'done'},
      {h:'Shipped — In Transit',m:'May 15 · 9:00 AM',s:'done'},
      {h:'Out for Delivery',m:'May 17 · 7:05 AM',s:'done'},
      {h:'Delivered',m:'May 17 · 8:20 AM · Signed: D.O.',s:'done'}
    ]
  },
  {
    id:'10475', status:'processed', date:'May 18, 2025 · 4:05 PM',
    name:'Priya Raman', email:'priya.raman@gmail.com', phone:'(555) 776-2043',
    ship:['44 Harbor Lane','Seattle, WA 98101','United States'],
    method:'USPS Ground Advantage', eta:'Awaiting label',
    tracking:'— not yet assigned —', carrier:'usps', carrierName:'USPS', noTrack:true,
    items:[{n:'Broadcast Long Sleeve',m:'Size S · Iron',p:52.00,g:'B'}],
    ship1:6.00, total:58.00,
    timeline:[
      {h:'Order Placed',m:'May 18 · 4:05 PM',s:'done'},
      {h:'Processed & Packed',m:'In progress',s:'now'},
      {h:'Shipped — In Transit',m:'Pending',s:'pending'},
      {h:'Out for Delivery',m:'Pending',s:'pending'},
      {h:'Delivered',m:'Pending',s:'pending'}
    ]
  }
];

/* ============ RENDER ============ */
const money = n => '$'+n.toFixed(2);
const esc = s => String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function orderHTML(o){
  const glyph = o.status==='delivered'?ICON.check:(o.status==='shipped'?ICON.truck:ICON.box);
  const pillIcon = o.status==='delivered'?ICON.check:(o.status==='shipped'?ICON.truck:ICON.box);
  const thumbs = o.items.slice(0,4).map(it=>`<div class="thumb">${esc(it.g)}</div>`).join('');
  const trackBlock = o.noTrack
    ? `<span class="sval" style="color:var(--iron-light)">${esc(o.tracking)}</span>`
    : `<button class="track" data-track="${esc(o.tracking)}">${esc(o.tracking)}</button><span class="copy-hint">Tap to copy</span>`;
  const timeline = o.timeline.map(t=>`
      <li class="tl-step ${t.s}"><span class="tl-dot"></span>
        <div class="tl-head">${esc(t.h)}</div>
        <div class="tl-meta">${esc(t.m)}</div>
      </li>`).join('');
  const lines = o.items.map(it=>`
      <div class="lineitem">
        <div class="li-thumb">${esc(it.g)}</div>
        <div class="li-info"><div class="li-name">${esc(it.n)}</div><div class="li-meta">${esc(it.m)}</div></div>
        <div class="li-price">${money(it.p)}</div>
      </div>`).join('');
  const subtotal = o.items.reduce((a,it)=>a+it.p,0);

  return `<article class="order s-${o.status} o-${o.status}" data-status="${o.status}"
      data-search="${esc((o.id+' '+o.name+' '+o.email+' '+o.tracking).toLowerCase())}">
    <div class="o-head">
      <div class="o-id">
        <div class="o-icon">${glyph}</div>
        <div><h3>#${esc(o.id)}</h3><div class="o-date">${esc(o.date)}</div></div>
      </div>
      <span class="pill ${o.status}">${pillIcon}${o.status}</span>
    </div>
    <div class="hr"></div>
    <div class="o-party">
      <div class="pcol">
        <div class="plabel">Customer</div>
        <div class="cust-line name">${ICON.user}${esc(o.name)}</div>
        <div class="cust-line dim">${ICON.mail}${esc(o.email)}</div>
        <div class="cust-line dim">${ICON.phone}${esc(o.phone)}</div>
      </div>
      <div class="pcol">
        <div class="plabel">Ship To</div>
        <div class="addr"><span class="who">${esc(o.name)}</span><br>${o.ship.map(esc).join('<br>')}</div>
      </div>
    </div>
    <div class="hr dash"></div>
    <div class="o-ship">
      <div class="scol"><div class="plabel">Shipping Method</div><div class="sval">${esc(o.method)}</div><div class="ssub">${esc(o.eta)}</div></div>
      <div class="scol"><div class="plabel">Tracking Number</div>${trackBlock}</div>
      <div class="scol"><div class="plabel">Carrier</div><div class="carrier"><span class="badge ${o.carrier}">${esc(o.carrierName)}</span></div></div>
    </div>
    <div class="hr"></div>
    <div class="o-foot">
      <div class="items-wrap"><span class="plabel">Items (${o.items.length})</span><div class="thumbs">${thumbs}</div></div>
      <div class="foot-right">
        <div class="total"><div class="plabel">Total</div><div class="amt">${money(o.total)}</div></div>
        <button class="expand-btn" aria-label="Toggle details">${ICON.chevron}</button>
      </div>
    </div>
    <div class="o-detail"><div class="detail-inner"><div class="detail-grid">
      <div>
        <div class="dtitle">Tracking</div>
        <ul class="timeline">${timeline}</ul>
      </div>
      <div>
        <div class="dtitle">Products</div>
        ${lines}
        <div class="li-totals">
          <div class="li-totrow"><span>Subtotal</span><span>${money(subtotal)}</span></div>
          <div class="li-totrow"><span>Shipping</span><span>${money(o.ship1)}</span></div>
          <div class="li-totrow grand"><span>Total</span><b>${money(o.total)}</b></div>
        </div>
      </div>
    </div></div></div>
  </article>`;
}

const manifest = document.getElementById('manifest');
function render(){ manifest.innerHTML = ORDERS.map(orderHTML).join(''); }
render();

/* counts */
const counts = {all:ORDERS.length,processed:0,shipped:0,delivered:0};
ORDERS.forEach(o=>counts[o.status]++);
['all','processed','shipped','delivered'].forEach(k=>document.getElementById('c-'+k).textContent=counts[k]);

/* ============ INTERACTIONS ============ */
let curFilter='all', curSearch='';
function applyFilters(){
  document.querySelectorAll('.order').forEach(el=>{
    const okStatus = curFilter==='all' || el.dataset.status===curFilter;
    const okSearch = !curSearch || el.dataset.search.includes(curSearch);
    el.style.display = (okStatus && okSearch)?'':'none';
  });
  const anyVisible=[...document.querySelectorAll('.order')].some(e=>e.style.display!=='none');
  let empty=document.getElementById('emptyState');
  if(!anyVisible){
    if(!empty){empty=document.createElement('div');empty.id='emptyState';empty.className='empty';
      empty.innerHTML='<h3>Nothing on the manifest.</h3><p>No orders match that filter or search.</p>';
      manifest.appendChild(empty);}
  } else if(empty){empty.remove();}
}

document.getElementById('tabrow').addEventListener('click',e=>{
  const t=e.target.closest('.tab'); if(!t)return;
  document.querySelectorAll('.tab').forEach(x=>x.classList.remove('on'));
  t.classList.add('on'); curFilter=t.dataset.filter; applyFilters();
});
document.getElementById('search').addEventListener('input',e=>{curSearch=e.target.value.trim().toLowerCase();applyFilters();});

manifest.addEventListener('click',e=>{
  const cp=e.target.closest('.track');
  if(cp){
    const v=cp.dataset.track;
    navigator.clipboard?.writeText(v).catch(()=>{});
    const hint=cp.nextElementSibling;
    if(hint){hint.textContent='✓ Copied';hint.classList.add('done');
      setTimeout(()=>{hint.textContent='Tap to copy';hint.classList.remove('done');},1600);}
    e.stopPropagation();return;
  }
  const art=e.target.closest('.order'); if(!art)return;
  if(e.target.closest('.o-detail'))return;
  art.classList.toggle('open');
});
</script>
</body></html>
