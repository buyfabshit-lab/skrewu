<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>SKREWU · The Board</title>
<style>
:root{
  --void:#0a0908; --void-2:#12100d; --panel:#17130e; --bone:#e8e2d4; --bone-dim:#a49c8d;
  --iron:#3a3530; --iron-2:#4b453d; --acid:#c4f135; --ember:#ff8a3d; --rust:#d8402f; --steel:#7f95b0;
  --disp:'Arial Narrow','Helvetica Neue',sans-serif; --body:'Courier New',ui-monospace,Menlo,monospace;
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;}
body{background:var(--void);color:var(--bone);font-family:var(--body);font-size:14px;overflow:hidden;display:flex;flex-direction:column;}
h1,h3{font-family:var(--disp);text-transform:uppercase;font-weight:700;letter-spacing:.03em;line-height:1;}
button{font-family:var(--body);cursor:pointer;}
a{color:inherit;text-decoration:none;}

/* top bar */
.top{display:flex;align-items:center;gap:14px;height:54px;padding:0 16px;border-bottom:1px solid var(--iron);
  background:rgba(10,9,8,.95);z-index:30;flex-shrink:0;}
.top .mark{font-family:var(--disp);letter-spacing:.14em;font-size:14px;text-transform:uppercase;white-space:nowrap;}
.top .mark b{color:var(--acid);}
.top .hint{color:var(--iron-2);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;flex:1;text-align:center;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.tbtn{background:var(--void-2);border:1px solid var(--iron);color:var(--bone-dim);padding:7px 12px;
  font-size:10px;text-transform:uppercase;letter-spacing:.1em;white-space:nowrap;}
.tbtn:hover{border-color:var(--acid);color:var(--acid);}

/* tray */
.tray{display:flex;gap:8px;align-items:center;padding:10px 16px;border-bottom:1px solid var(--iron);
  overflow-x:auto;background:var(--void-2);flex-shrink:0;-webkit-overflow-scrolling:touch;}
.tray .tl{font-size:9.5px;color:var(--iron-2);letter-spacing:.14em;text-transform:uppercase;white-space:nowrap;margin-right:4px;}
.tray button{background:var(--void);border:1px dashed var(--iron);color:var(--bone-dim);padding:7px 11px;
  font-size:11px;white-space:nowrap;}
.tray button:hover{border-color:var(--acid);color:var(--acid);}

/* board */
.viewport{flex:1;overflow:auto;position:relative;-webkit-overflow-scrolling:touch;}
.canvas{position:relative;width:2300px;height:1500px;
  background-image:radial-gradient(circle, #1d1a15 1.1px, transparent 1.1px);
  background-size:26px 26px;}
#wires{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;}
#wires path{pointer-events:stroke;cursor:pointer;}

/* nodes */
.node{position:absolute;width:196px;background:linear-gradient(180deg,var(--panel),var(--void-2));
  border:1px solid var(--iron);user-select:none;touch-action:none;z-index:5;}
.node.dragging{z-index:20;border-color:var(--iron-2);}
.node .head{display:flex;align-items:center;gap:8px;padding:9px 10px;border-bottom:1px solid var(--iron);cursor:grab;}
.node .dotst{width:8px;height:8px;border-radius:50%;flex-shrink:0;box-shadow:0 0 8px currentColor;}
.node[data-status=live] .dotst{color:var(--acid);background:var(--acid);}
.node[data-status=key] .dotst{color:var(--ember);background:var(--ember);}
.node[data-status=gated] .dotst{color:var(--rust);background:var(--rust);}
.node[data-status=manual] .dotst{color:var(--steel);background:var(--steel);}
.node .head h3{font-size:13.5px;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.node .rm{background:none;border:none;color:var(--iron-2);font-size:14px;line-height:1;padding:2px 4px;}
.node .rm:hover{color:var(--rust);}
.node .body{padding:8px 10px 10px;}
.node .desc{font-size:10.5px;color:var(--bone-dim);line-height:1.4;min-height:29px;}
.node .row{display:flex;align-items:center;justify-content:space-between;margin-top:8px;gap:6px;}
.node .st{font-size:8.5px;letter-spacing:.1em;text-transform:uppercase;border:1px solid currentColor;padding:2px 6px;white-space:nowrap;}
.node[data-status=live] .st{color:var(--acid);}
.node[data-status=key] .st{color:var(--ember);}
.node[data-status=gated] .st{color:var(--rust);}
.node[data-status=manual] .st{color:var(--steel);}
.node .open{background:var(--void);border:1px solid var(--iron);color:var(--bone-dim);padding:5px 10px;
  font-size:9.5px;text-transform:uppercase;letter-spacing:.08em;}
.node .open:hover{border-color:var(--acid);color:var(--acid);}

/* ports */
.port{position:absolute;top:50%;width:16px;height:16px;border-radius:50%;background:var(--void);
  border:2px solid var(--iron-2);transform:translateY(-50%);cursor:crosshair;z-index:6;}
.port::after{content:"";position:absolute;inset:-8px;}  /* fat touch target */
.port.in{left:-9px;} .port.out{right:-9px;}
.port:hover{border-color:var(--acid);}
.port.armed{border-color:var(--acid);background:var(--acid);box-shadow:0 0 12px var(--acid);}

/* folder endpoint blocks */
.node.folder{width:172px;border-color:var(--iron-2);background:linear-gradient(180deg,#1a160f,var(--void-2));}
.node.folder::before{content:"";position:absolute;top:-9px;left:10px;width:52px;height:9px;
  background:#1a160f;border:1px solid var(--iron-2);border-bottom:none;}
.node.folder .head{cursor:grab;border-bottom:1px solid var(--iron);}
.node.folder .head h3{font-size:12.5px;color:var(--bone-dim);}
.node.folder .loc{padding:9px 10px 4px;font-size:12px;color:var(--acid);word-break:break-all;line-height:1.35;}
.node.folder .loc.unset{color:var(--iron-2);}
.node.folder .sub{padding:0 10px;font-size:9px;color:var(--iron-2);letter-spacing:.06em;text-transform:uppercase;}
.node.folder .row{padding:8px 10px 10px;display:flex;gap:6px;}
.node.folder .open{flex:1;text-align:center;}
.node.folder .port.out{display:none;}

/* toast */
.toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%) translateY(16px);background:var(--acid);color:var(--void);
  font-family:var(--disp);text-transform:uppercase;letter-spacing:.06em;font-size:12.5px;padding:10px 18px;
  opacity:0;pointer-events:none;transition:.22s;z-index:60;max-width:92vw;text-align:center;}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
</style>
</head>
<body>

<div class="top">
  <a class="mark" href="hub.html">SKREW<b>U</b> · Board</a>
  <span class="hint" id="hint">Drag blocks · tap a right port, then a left port to wire · tap a wire to cut it</span>
  <button class="tbtn" id="zoomOut" type="button" title="Zoom out">−</button>
  <button class="tbtn" id="zoomFit" type="button" title="Fit the line on screen">Fit</button>
  <button class="tbtn" id="zoomIn" type="button" title="Zoom in">+</button>
  <button class="tbtn" id="resetBtn" type="button">Reset line</button>
</div>

<div class="tray" id="tray"><span class="tl">Add a step:</span></div>

<div class="viewport" id="viewport">
  <div id="zoomOuter">
    <div class="canvas" id="canvas">
      <svg id="wires"></svg>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="board.js"></script>
</body>
</html>
