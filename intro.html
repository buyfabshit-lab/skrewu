<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>SKREWU · Come In</title>
<style>
:root{
  --void:#0a0908; --void-2:#12100d; --panel:#17130e; --bone:#e8e2d4; --bone-dim:#a49c8d;
  --iron:#3a3530; --iron-2:#4b453d; --acid:#c4f135; --ember:#ff8a3d; --rust:#a32a1f; --rust-bright:#c43a2c;
  --disp:'Arial Narrow','Helvetica Neue',sans-serif; --body:'Courier New',ui-monospace,Menlo,monospace;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:
    radial-gradient(900px 520px at 50% -12%, rgba(196,241,53,.09), transparent 62%),
    radial-gradient(700px 420px at 12% 108%, rgba(196,42,31,.10), transparent 58%),
    var(--void);
  color:var(--bone);font-family:var(--body);font-size:15px;line-height:1.6;
  -webkit-font-smoothing:antialiased;min-height:100vh;}
h1,h2,h3{font-family:var(--disp);text-transform:uppercase;font-weight:700;letter-spacing:.02em;line-height:1.02;}
a{color:inherit;text-decoration:none;}
button{font-family:var(--body);cursor:pointer;}
:focus-visible{outline:3px solid var(--acid);outline-offset:2px;}
.wrap{max-width:820px;margin:0 auto;padding:0 20px 80px;}

.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;height:56px;
  border-bottom:1px solid var(--iron);max-width:820px;margin:0 auto;padding:0 20px;}
.bar .mark{font-family:var(--disp);letter-spacing:.16em;font-size:14px;}
.bar .mark b{color:var(--acid);}
.bar .skip{font-size:10px;letter-spacing:.13em;text-transform:uppercase;color:var(--iron-2);
  background:none;border:0;padding:6px 2px;}
.bar .skip:hover{color:var(--acid);}

/* how she talks to you */
.how{display:flex;gap:7px;justify-content:center;margin:26px 0 4px;}
.how button{background:var(--void-2);border:1px solid var(--iron);color:var(--bone-dim);
  font-size:11px;letter-spacing:.13em;text-transform:uppercase;padding:9px 15px;transition:.15s;}
.how button:hover{border-color:var(--iron-2);color:var(--bone);}
.how button.on{border-color:var(--acid);color:var(--acid);background:transparent;}

/* her */
.her{display:flex;flex-direction:column;align-items:center;padding:22px 0 6px;}
.face{width:clamp(150px,42vw,210px);height:auto;filter:drop-shadow(0 0 26px rgba(196,241,53,.18));}
.eye{fill:var(--acid);opacity:.92;animation:blink 6.5s infinite;}
@keyframes blink{0%,94%,100%{transform:scaleY(1);}96%,98%{transform:scaleY(.08);}}
.eye{transform-origin:center;transform-box:fill-box;}
.plate{fill:none;stroke:var(--iron-2);stroke-width:2;}
.plate2{fill:none;stroke:var(--iron);stroke-width:1.5;}
/* mouth: bars that only move while she's actually talking */
.mbar{fill:var(--acid);transform-origin:center;transform-box:fill-box;transform:scaleY(.16);
  transition:transform .12s;}
.talking .mbar{animation:say .46s ease-in-out infinite alternate;}
.talking .mbar:nth-child(2){animation-duration:.31s;}
.talking .mbar:nth-child(3){animation-duration:.24s;}
.talking .mbar:nth-child(4){animation-duration:.37s;}
.talking .mbar:nth-child(5){animation-duration:.28s;}
@keyframes say{from{transform:scaleY(.16);}to{transform:scaleY(1);}}
@media(prefers-reduced-motion:reduce){
  .talking .mbar{animation:none;transform:scaleY(.5);}
  .eye{animation:none;}
}
.hername{font-size:10px;letter-spacing:.28em;text-transform:uppercase;color:var(--iron-2);margin-top:12px;}

/* what she says */
.said{min-height:118px;margin:16px auto 0;max-width:34ch;text-align:center;font-size:clamp(16px,3.6vw,20px);
  line-height:1.5;}
.said .done{color:var(--bone-dim);}
.said .now{color:var(--bone);}
.cur{display:inline-block;width:.55ch;background:var(--acid);animation:cur .9s steps(1) infinite;}
@keyframes cur{50%{opacity:0;}}

/* the fork */
.fork{margin-top:34px;opacity:0;transform:translateY(10px);transition:.5s;pointer-events:none;}
.fork.in{opacity:1;transform:none;pointer-events:auto;}
.fork h2{font-size:clamp(21px,4.4vw,29px);text-align:center;}
.fork .sub{text-align:center;color:var(--bone-dim);font-size:12.5px;margin-top:8px;}
.ways{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:22px;}
@media(max-width:640px){.ways{grid-template-columns:1fr;}}
.way{background:linear-gradient(180deg,var(--panel),var(--void-2));border:1px solid var(--iron);
  padding:18px 17px;text-align:left;display:flex;flex-direction:column;gap:9px;position:relative;
  overflow:hidden;transition:.16s;color:inherit;width:100%;}
.way::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--iron-2);transition:.16s;}
.way:hover{border-color:var(--acid);transform:translateY(-2px);}
.way:hover::before{background:var(--acid);}
.way h3{font-size:19px;}
.way .s{font-size:12.5px;color:var(--bone-dim);}
.way .go{font-family:var(--disp);text-transform:uppercase;letter-spacing:.06em;font-size:12px;color:var(--bone-dim);}
.way:hover .go{color:var(--acid);}

/* every road, same door */
.same{margin-top:20px;border:1px solid var(--iron);background:var(--void-2);padding:15px;
  display:flex;align-items:center;justify-content:center;gap:11px;flex-wrap:wrap;text-align:center;}
.same .l{font-size:10px;letter-spacing:.15em;text-transform:uppercase;color:var(--iron-2);}
.same .d{font-family:var(--disp);text-transform:uppercase;font-size:15px;color:var(--acid);letter-spacing:.04em;}
.opened{text-align:center;margin-top:16px;font-size:11.5px;color:var(--iron-2);letter-spacing:.05em;}
.opened a{color:var(--bone-dim);border-bottom:1px solid var(--iron);}
.opened a:hover{color:var(--acid);border-color:var(--acid);}
</style>
</head>
<body>

<div class="bar">
  <span class="mark" id="mark">SKREW<b>U</b></span>
  <button class="skip" id="skip" type="button">Skip →</button>
</div>

<main class="wrap">
  <div class="how">
    <button id="mType" class="on" type="button">Type it</button>
    <button id="mSay" type="button">Say it out loud</button>
  </div>

  <div class="her">
    <svg class="face" id="face" viewBox="0 0 200 210" role="img" aria-label="Your guide">
      <!-- plate -->
      <path class="plate" d="M40 46 Q100 18 160 46 L168 118 Q100 200 32 118 Z"/>
      <path class="plate2" d="M52 58 Q100 36 148 58 L154 114 Q100 178 46 114 Z"/>
      <line class="plate2" x1="100" y1="20" x2="100" y2="40"/>
      <!-- eyes -->
      <g>
        <rect class="eye" x="62" y="86" width="28" height="9" rx="4"/>
        <rect class="eye" x="110" y="86" width="28" height="9" rx="4"/>
      </g>
      <!-- mouth: five bars -->
      <g id="mouth" transform="translate(0,0)">
        <rect class="mbar" x="72"  y="122" width="7" height="26" rx="3"/>
        <rect class="mbar" x="85"  y="122" width="7" height="26" rx="3"/>
        <rect class="mbar" x="98"  y="122" width="7" height="26" rx="3"/>
        <rect class="mbar" x="111" y="122" width="7" height="26" rx="3"/>
        <rect class="mbar" x="124" y="122" width="7" height="26" rx="3"/>
      </g>
    </svg>
    <div class="hername" id="hername">Your guide</div>
  </div>

  <div class="said" id="said"></div>

  <section class="fork" id="fork">
    <h2 id="forkAsk">So — which one sounds like you?</h2>
    <div class="sub">Pick any of them. You can change it later, and nothing is switched off.</div>
    <div class="ways" id="ways"></div>
    <div class="same">
      <span class="l">Every one of them ends</span>
      <span class="d">Order out the door</span>
    </div>
    <p class="opened">
      Everything's already open — <a href="hub.html">see all of it</a> if you'd rather poke around.
    </p>
  </section>
</main>

<script src="theme.js"></script>
<script src="starters.js"></script>
<script src="intro.js"></script>
</body>
</html>
