:root{
  --void:#0a0908;
  --void-2:#13110f;
  --void-3:#1c1916;
  --bone:#e8e2d4;
  --bone-dim:#a8a194;
  --rust:#a32a1f;
  --rust-bright:#c43a2c;
  --acid:#c4f135;
  --iron:#3a3530;
  --iron-light:#56504a;
  --ember:#ff6b35;
  --paper:#ece6d8;

  /* logo-maker accent — mapped to the SKREW U brand (rust primary) */
  --volt:#a32a1f;
  --volt-bright:#c43a2c;
  --volt-dim:#6e1c14;
  --volt-glow:rgba(196,58,44,0.34);

  --display:'Death Corps Pro','Arial Narrow','Helvetica Neue',sans-serif;
  --body:'Courier New',ui-monospace,'SF Mono',Menlo,monospace;

  --rail-w:88px;
  --header-h:62px;
  --tabbar-h:66px;
}

*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;}
body{
  background:var(--void);
  color:var(--bone);
  font-family:var(--body);
  font-size:15px;
  line-height:1.5;
  overflow:hidden;
  -webkit-font-smoothing:antialiased;
}
@media (prefers-reduced-motion:reduce){
  *{animation-duration:.01ms!important;transition-duration:.01ms!important;}
}
h1,h2,h3,h4{
  font-family:var(--display);text-transform:uppercase;
  letter-spacing:.02em;font-weight:700;line-height:1.05;
}
button{font-family:var(--body);cursor:pointer;color:inherit;background:none;border:none;}
img,svg{display:block;max-width:100%;}
:focus-visible{outline:2px solid var(--acid);outline-offset:2px;}
::-webkit-scrollbar{width:6px;height:6px;}
::-webkit-scrollbar-thumb{background:var(--iron);border-radius:3px;}

/* ============ APP SHELL ============ */
.app{
  height:100dvh;max-width:520px;margin:0 auto;
  display:flex;flex-direction:column;
  background:var(--void);position:relative;
  border-left:1px solid var(--iron);border-right:1px solid var(--iron);
}

/* ---- HEADER ---- */
.app-header{
  height:var(--header-h);flex-shrink:0;
  display:flex;align-items:center;gap:12px;padding:0 14px;
  border-bottom:1px solid var(--iron);
  background:linear-gradient(180deg,var(--void-2),var(--void));
}
.hdr-burger{display:flex;flex-direction:column;gap:5px;padding:6px 4px;}
.hdr-burger span{width:22px;height:2px;background:var(--bone);display:block;}
.hdr-title{flex:1;text-align:center;line-height:1;}
.hdr-title .t1{font-size:20px;letter-spacing:.04em;}
.hdr-title .t1 em{color:var(--volt-bright);font-style:normal;}
.hdr-title .t2{
  font-family:var(--body);font-size:9px;color:var(--bone-dim);
  letter-spacing:.22em;text-transform:uppercase;margin-top:3px;
}
.hdr-pro{
  width:38px;height:34px;border-radius:8px;
  display:grid;place-items:center;
  background:linear-gradient(135deg,#4a3a10,#2a2109);
  border:1px solid #6b5518;color:#ffcf3a;font-size:16px;
}
.hdr-export{
  display:flex;align-items:center;gap:6px;
  background:linear-gradient(135deg,var(--volt),var(--volt-dim));
  color:#fff;padding:9px 14px;border-radius:9px;
  font-size:11px;letter-spacing:.12em;text-transform:uppercase;font-weight:700;
  box-shadow:0 4px 14px var(--volt-glow);
  transition:transform .15s ease,box-shadow .2s ease;
}
.hdr-export:hover{transform:translateY(-1px);box-shadow:0 6px 18px var(--volt-glow);}
.hdr-export:active{transform:translateY(0);}

/* ---- SCROLL BODY ---- */
.app-body{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;}

/* ============ SECTION: QUICK ACTIONS (3 cards) ============ */
.section{padding:14px 12px 4px;}
.section-label{
  display:flex;align-items:center;gap:8px;
  font-size:11px;letter-spacing:.16em;text-transform:uppercase;
  color:var(--bone-dim);margin:2px 4px 11px;
}
.section-label .ico{color:var(--volt-bright);}
.section-label::after{content:'';flex:1;height:1px;background:var(--iron);}

.quick-row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;}
.quick-card{
  border:1px solid var(--iron);border-radius:12px;
  background:linear-gradient(160deg,var(--void-2),var(--void));
  padding:14px 8px;text-align:center;
  display:flex;flex-direction:column;align-items:center;gap:8px;
  transition:border-color .18s ease,transform .15s ease,background .18s ease;
}
.quick-card:hover{border-color:var(--volt-dim);transform:translateY(-2px);}
.quick-card.is-active{
  border-color:var(--volt);background:linear-gradient(160deg,rgba(139,92,246,0.16),var(--void-2));
  box-shadow:0 0 0 1px var(--volt-dim) inset,0 6px 20px var(--volt-glow);
}
.quick-card .qc-ico{
  width:40px;height:40px;border-radius:10px;display:grid;place-items:center;
  background:var(--void-3);border:1px solid var(--iron);color:var(--volt-bright);
}
.quick-card.is-active .qc-ico{background:var(--volt);color:#fff;border-color:var(--volt);}
.quick-card .qc-t{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;font-family:var(--display);}
.quick-card .qc-s{font-size:9.5px;color:var(--bone-dim);letter-spacing:.08em;text-transform:uppercase;}

/* ============ EDITOR STAGE: rail + canvas ============ */
.stage{display:flex;gap:0;padding:12px;align-items:flex-start;}
.tool-rail{
  width:var(--rail-w);flex-shrink:0;
  display:flex;flex-direction:column;gap:6px;
  padding-right:10px;
}
.tool{
  display:flex;flex-direction:column;align-items:center;gap:5px;
  padding:11px 4px;border-radius:11px;border:1px solid transparent;
  background:var(--void-2);transition:all .16s ease;position:relative;
}
.tool:hover{background:var(--void-3);border-color:var(--iron);}
.tool.is-active{
  background:linear-gradient(160deg,rgba(139,92,246,0.18),var(--void-2));
  border-color:var(--volt);
}
.tool.is-active::before{
  content:'';position:absolute;left:0;top:14px;bottom:14px;width:3px;
  background:var(--volt-bright);border-radius:0 3px 3px 0;
}
.tool .t-ico{color:var(--bone);width:24px;height:24px;display:grid;place-items:center;}
.tool.is-active .t-ico{color:var(--volt-bright);}
.tool .t-name{font-size:8.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--bone-dim);text-align:center;line-height:1.15;}
.tool.is-active .t-name{color:var(--bone);}
.tool .t-badge{position:absolute;top:5px;right:5px;font-size:7px;color:#ffcf3a;}

/* ---- CANVAS ---- */
.canvas-col{flex:1;min-width:0;display:flex;flex-direction:column;gap:10px;}
.canvas{
  position:relative;border-radius:14px;overflow:hidden;
  border:1px solid var(--iron);
  aspect-ratio:1/1;
  background:
    linear-gradient(45deg,#181410 25%,transparent 25%,transparent 75%,#181410 75%,#181410),
    linear-gradient(45deg,#181410 25%,#211c17 25%,#211c17 75%,#181410 75%,#181410);
  background-size:24px 24px;background-position:0 0,12px 12px;
  display:grid;place-items:center;user-select:none;touch-action:none;
}
.canvas .badge{
  position:absolute;top:12px;font-size:10px;letter-spacing:.14em;text-transform:uppercase;
  padding:5px 12px;border-radius:20px;font-weight:700;z-index:4;pointer-events:none;
}
.canvas .badge-before{left:12px;background:rgba(30,27,23,.85);color:var(--bone-dim);border:1px solid var(--iron);}
.canvas .badge-after{right:12px;background:var(--acid);color:var(--void);}
.canvas-empty{text-align:center;color:var(--bone-dim);padding:20px;z-index:2;}
.canvas-empty .ce-ico{color:var(--iron-light);margin:0 auto 12px;}
.canvas-empty .ce-t{font-family:var(--display);text-transform:uppercase;font-size:15px;color:var(--bone);letter-spacing:.04em;}
.canvas-empty .ce-s{font-size:11px;margin-top:6px;letter-spacing:.04em;}
.canvas-empty .ce-btn{
  margin-top:14px;display:inline-flex;align-items:center;gap:7px;
  background:var(--volt);color:#fff;padding:10px 18px;border-radius:9px;
  font-size:11px;letter-spacing:.1em;text-transform:uppercase;font-weight:700;
}
.canvas img.art{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;padding:8%;z-index:1;}
/* after-reveal clip driven by --split */
.canvas .after-wrap{position:absolute;inset:0;z-index:2;clip-path:inset(0 0 0 var(--split,50%));}
/* processing overlay + spinner */
.canvas .proc{position:absolute;inset:0;z-index:7;display:none;place-items:center;background:rgba(10,9,8,.62);backdrop-filter:blur(2px);}
.canvas.is-processing .proc{display:grid;}
.canvas.is-processing .split-handle{display:none;}
.proc .spin{width:38px;height:38px;border-radius:50%;border:3px solid var(--iron);border-top-color:var(--volt-bright);animation:spin .7s linear infinite;}
.proc .proc-t{margin-top:12px;font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--bone-dim);}
@keyframes spin{to{transform:rotate(360deg)}}
.canvas .split-line{
  position:absolute;top:0;bottom:0;left:var(--split,50%);width:2px;
  background:var(--volt-bright);z-index:5;transform:translateX(-1px);box-shadow:0 0 12px var(--volt-glow);
}
.canvas .split-handle{
  position:absolute;top:50%;left:var(--split,50%);z-index:6;
  width:38px;height:38px;border-radius:50%;transform:translate(-50%,-50%);
  background:var(--volt);display:grid;place-items:center;color:#fff;
  box-shadow:0 4px 16px var(--volt-glow);cursor:ew-resize;
}
.canvas.no-compare .after-wrap{clip-path:none;}
.canvas.no-compare .split-line,.canvas.no-compare .split-handle,.canvas.no-compare .badge{display:none;}

/* ---- EDITOR ACTION BAR ---- */
.editbar{
  display:grid;grid-template-columns:repeat(5,1fr);gap:4px;
  border:1px solid var(--iron);border-radius:12px;background:var(--void-2);
  padding:8px 4px;
}
.editbar button{
  display:flex;flex-direction:column;align-items:center;gap:5px;
  padding:6px 2px;border-radius:8px;transition:background .15s ease;
}
.editbar button:hover:not(:disabled){background:var(--void-3);}
.editbar button:disabled{opacity:.32;cursor:not-allowed;}
.editbar .eb-name{font-size:8.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--bone-dim);}
.editbar .eb-ico{color:var(--bone);}

/* ============ DFT PRODUCTION TOOLS ============ */
.prod-scroll{display:grid;grid-auto-flow:column;grid-auto-columns:118px;gap:10px;overflow-x:auto;padding:2px 4px 8px;scroll-snap-type:x mandatory;}
.prod-card{
  scroll-snap-align:start;
  border:1px solid var(--iron);border-radius:12px;
  background:linear-gradient(165deg,var(--void-2),var(--void));
  padding:14px 10px;text-align:center;
  display:flex;flex-direction:column;align-items:center;gap:8px;
  transition:border-color .18s ease,transform .15s ease;
}
.prod-card:hover{border-color:var(--volt-dim);transform:translateY(-2px);}
.prod-card.is-active{border-color:var(--volt);box-shadow:0 6px 20px var(--volt-glow);}
.prod-card .pc-ico{
  width:44px;height:44px;border-radius:11px;display:grid;place-items:center;
  background:var(--void-3);border:1px solid var(--iron);color:var(--volt-bright);
}
.prod-card.is-active .pc-ico{background:var(--volt);color:#fff;}
.prod-card .pc-t{font-family:var(--display);font-size:12px;letter-spacing:.04em;text-transform:uppercase;}
.prod-card .pc-s{font-size:9px;color:var(--bone-dim);letter-spacing:.06em;text-transform:uppercase;}

/* ============ INFO BANNER ============ */
.info-banner{
  margin:6px 4px 4px;display:flex;align-items:center;gap:14px;
  border:1px solid var(--volt-dim);border-radius:14px;padding:16px;
  background:linear-gradient(120deg,rgba(139,92,246,0.14),rgba(139,92,246,0.03));
}
.info-banner .ib-star{color:var(--volt-bright);flex-shrink:0;}
.info-banner .ib-t{font-family:var(--display);font-size:15px;letter-spacing:.03em;text-transform:uppercase;}
.info-banner .ib-s{font-size:11px;color:var(--bone-dim);margin-top:4px;letter-spacing:.03em;}

/* ============ BOTTOM TAB BAR ============ */
.tabbar{
  height:var(--tabbar-h);flex-shrink:0;position:relative;
  display:grid;grid-template-columns:repeat(5,1fr);align-items:center;
  border-top:1px solid var(--iron);
  background:linear-gradient(0deg,var(--void-2),var(--void));
}
.tab{display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 0;color:var(--bone-dim);transition:color .15s ease;}
.tab:hover{color:var(--bone);}
.tab.is-active{color:var(--volt-bright);}
.tab .tab-name{font-size:9px;letter-spacing:.1em;text-transform:uppercase;}
.tab-new{
  position:relative;
}
.tab-new .fab{
  width:54px;height:54px;border-radius:50%;margin:-26px auto 0;
  background:linear-gradient(135deg,var(--volt),var(--volt-dim));
  display:grid;place-items:center;color:#fff;
  box-shadow:0 6px 20px var(--volt-glow);border:3px solid var(--void);
  transition:transform .15s ease;
}
.tab-new .fab:hover{transform:scale(1.06);}
.tab-new .tab-name{margin-top:4px;}

/* ---- toast ---- */
.toast{
  position:fixed;left:50%;bottom:calc(var(--tabbar-h) + 16px);transform:translateX(-50%) translateY(20px);
  background:var(--void-3);border:1px solid var(--volt-dim);color:var(--bone);
  padding:11px 18px;border-radius:10px;font-size:12px;letter-spacing:.04em;
  z-index:900;opacity:0;pointer-events:none;transition:opacity .2s ease,transform .2s ease;
  max-width:88%;text-align:center;box-shadow:0 8px 30px rgba(0,0,0,.5);
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
.toast b{color:var(--volt-bright);}

/* wide screens: keep it phone-framed but breathe */
@media (min-width:521px){
  body{background:#050403;}
  .app{margin-top:14px;margin-bottom:14px;height:calc(100dvh - 28px);border:1px solid var(--iron);border-radius:20px;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.6);}
}
</style>
</head>

<script>
/* =========================================================================
   GANG SHEET LOGO MAKER — scaffold
   Buttons are DATA-DRIVEN so new ones can be dropped in "as we go":
   just add an entry to the arrays below (or a data-act attribute) and it
   wires itself up. Each button currently fires a placeholder toast; swap the
   handler body for real logic when the feature is ready.
   ========================================================================= */

/* ---- icon set (inline SVG paths, 24x24 stroke) ---- */
const ICON = {
  wand:'<path d="M15 4V2M15 16v-2M8 9h2M20 9h2M17.8 11.8 19 13M15 9h0M17.8 6.2 19 5M3 21l9-9M12.2 6.2 11 5"/>',

  hd:'<rect x="2" y="6" width="20" height="12" rx="2"/><path d="M6 9v6M6 12h3M9 9v6M13 9h2a2 2 0 0 1 2 2v2a2 2 0 0 1-2 2h-2z"/>',
  vector:'<circle cx="6" cy="6" r="2.5"/><circle cx="18" cy="18" r="2.5"/><path d="M8.2 7.8 15.8 15.8M6 8.5V15a3 3 0 0 0 3 3h6"/>',
  palette:'<circle cx="13.5" cy="6.5" r="1"/><circle cx="17.5" cy="10.5" r="1"/><circle cx="8.5" cy="7.5" r="1"/><circle cx="6.5" cy="12.5" r="1"/><path d="M12 2a10 10 0 1 0 0 20c1.4 0 2-1 2-2s-.6-2-2-2h-1a2 2 0 0 1 0-4h5a4 4 0 0 0 4-4c0-4.4-3.6-8-8-8z"/>',
  sharpen:'<path d="M12 3 2 20h20z"/>',
  noise:'<circle cx="6" cy="6" r="1"/><circle cx="12" cy="6" r="1"/><circle cx="18" cy="6" r="1"/><circle cx="6" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="18" cy="12" r="1"/><circle cx="6" cy="18" r="1"/><circle cx="12" cy="18" r="1"/><circle cx="18" cy="18" r="1"/>',
  defringe:'<rect x="4" y="4" width="16" height="16" rx="2" stroke-dasharray="3 3"/><path d="M9 9h6v6H9z"/>',
  shadow:'<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M5 5l1.5 1.5M17.5 17.5 19 19"/>',
  droplet:'<path d="M12 2.7 6.3 9a8 8 0 1 0 11.4 0z"/>',
  boost:'<circle cx="12" cy="12" r="9"/><path d="M8 12l3 3 5-6"/>',

  scan:'<path d="M3 7V5a2 2 0 0 1 2-2h2M17 3h2a2 2 0 0 1 2 2v2M21 17v2a2 2 0 0 1-2 2h-2M7 21H5a2 2 0 0 1-2-2v-2"/><rect x="8" y="8" width="8" height="8" rx="1"/>'
};
function svg(paths){
  return '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">'+paths+'</svg>';
}

/* ============================================================
   BUTTON REGISTRIES  —  add / edit / remove buttons here
   ============================================================ */

// SECTION 1 · Quick Actions (the 3 hero cards)
const QUICK_ACTIONS = [
  {id:'remove-bg', title:'Remove BG',  sub:'Auto & Precise', icon:'wand',    active:true},
  {id:'enhance',   title:'Enhance',    sub:'AI Power Boost', icon:'sparkle'},
  {id:'upscale',   title:'HD Upscale', sub:'High Res',       icon:'hd'}
];

// SECTION 2 · Tool Rail (left side of the canvas)
const TOOLS = [
  {id:'ai-remover',  name:'AI Remover',   icon:'wand',     active:true},
  {id:'enhance',     name:'Enhance',      icon:'sparkle'},
  {id:'hd-upscale',  name:'HD Upscale',   icon:'hd'},
  {id:'vectorize',   name:'Vectorize',    icon:'vector'},
  {id:'color-fix',   name:'Color Fix',    icon:'palette'},
  {id:'sharpen',     name:'Sharpen',      icon:'sharpen'},
  {id:'noise',       name:'Noise Reduce', icon:'noise'},
  {id:'defringe',    name:'Defringe',     icon:'defringe'},
  {id:'shadow-fix',  name:'Shadow Fix',   icon:'shadow'}
];

// SECTION 3 · DFT & Shirt Production Tools (horizontal cards)
const PRODUCTION_TOOLS = [
  {id:'dtf-optimize',  title:'DTF Optimize', sub:'Bright & Bold',   icon:'scan'},
  {id:'white-ink',     title:'White Ink',    sub:'Add Underbase',   icon:'droplet'},
  {id:'color-boost',   title:'Color Boost',  sub:'Vibrant Colors',  icon:'boost'},
  {id:'ink-save',      title:'Ink Save',     sub:'Optimize Ink',    icon:'save'},
  {id:'transparency',  title:'Transparency', sub:'Smart Clean',     icon:'grid'}
];

/* ============================================================
   RENDERERS
   ============================================================ */
const $ = (s,r=document)=>r.querySelector(s);
const $$ = (s,r=document)=>[...r.querySelectorAll(s)];

function renderQuick(){
  $('#quick-actions').innerHTML = QUICK_ACTIONS.map(a=>`
    <button class="quick-card${a.active?' is-active':''}" data-id="${a.id}" data-group="quick">
      <span class="qc-ico">${svg(ICON[a.icon]||'')}</span>
      <span class="qc-t">${a.title}</span>
      <span class="qc-s">${a.sub}</span>
    </button>`).join('');
}
function renderTools(){
  $('#tool-rail').innerHTML = TOOLS.map(t=>`
    <button class="tool${t.active?' is-active':''}" data-id="${t.id}" data-group="tool">
      <span class="t-ico">${svg(ICON[t.icon]||'')}</span>
      <span class="t-name">${t.name}</span>
    </button>`).join('');
}
function renderProduction(){
  $('#production-tools').innerHTML = PRODUCTION_TOOLS.map(p=>`
    <button class="prod-card" data-id="${p.id}" data-group="prod">
      <span class="pc-ico">${svg(ICON[p.icon]||'')}</span>
      <span class="pc-t">${p.title}</span>
      <span class="pc-s">${p.sub}</span>
    </button>`).join('');
}
renderQuick(); renderTools(); renderProduction();

/* ============================================================
   TOAST  (placeholder feedback until real features land)
   ============================================================ */
let toastT;
function toast(msg){
  const el=$('#toast');
  el.innerHTML=msg;
  el.classList.add('show');
  clearTimeout(toastT);
  toastT=setTimeout(()=>el.classList.remove('show'),1900);
}

/* ============================================================
   GENERIC BUTTON WIRING
   Every registry button routes through here. Replace the switch
   bodies with real handlers as each feature is built.
   ============================================================ */
function handleAction(group,id,label){
  // ---- real handlers (fill these in as features land) ----
  if(id==='remove-bg' || id==='ai-remover'){ runRemoveBG(); return; }
  // ---- everything else: placeholder feedback for now ----
  toast(`<b>${label}</b> — wire this up next`);
}

// exclusive-select within a group (quick cards + tool rail highlight)
function selectInGroup(groupSel,btn){
  $$(groupSel).forEach(b=>b.classList.remove('is-active'));
  btn.classList.add('is-active');
}

document.addEventListener('click',e=>{
  const btn=e.target.closest('[data-group]');
  if(!btn) return;
  const {group,id}=btn.dataset;
  const label=(btn.querySelector('.qc-t,.t-name,.pc-t')||{}).textContent||id;
  if(group==='quick') selectInGroup('#quick-actions .quick-card',btn);
  if(group==='tool')  selectInGroup('#tool-rail .tool',btn);
  handleAction(group,id,label);
});

/* ---- header buttons ---- */
$('#btn-menu').addEventListener('click',()=>toast('<b>Menu</b> — wire this up next'));
$('#btn-pro').addEventListener('click',()=>toast('<b>Go Pro</b> — wire this up next'));
$('#btn-export').addEventListener('click',doExport);

/* ---- edit action bar ---- */
$('#editbar').addEventListener('click',e=>{
  const btn=e.target.closest('button[data-act]');
  if(!btn||btn.disabled) return;
  const act=btn.dataset.act;
  if(act==='compare'){ toggleCompare(); return; }
  if(act==='reset'){ resetCanvas(); return; }
  if(act==='undo'){ doUndo(); return; }
  handleAction('edit',act,btn.querySelector('.eb-name').textContent);
});

/* ---- bottom tab bar ---- */
$('#tabbar').addEventListener('click',e=>{
  const tab=e.target.closest('.tab');
  if(!tab) return;
  const name=tab.dataset.tab;
  if(name==='new'){ resetCanvas(); toast('<b>New</b> gang sheet'); return; }
  $$('.tab').forEach(t=>t.classList.remove('is-active'));
  tab.classList.add('is-active');
  toast(`<b>${tab.querySelector('.tab-name').textContent}</b> — wire this up next`);
});

/* ============================================================
   CANVAS · upload + before/after compare slider
   (This part is wired for real so there's something to play with.)
   ============================================================ */
const state={hasImage:false,compare:false,processing:false,original:null,result:null};
const canvas=$('#canvas');

function loadImage(src){
  state.original=src; state.result=null; state.hasImage=true; state.compare=true;
  canvas.classList.remove('no-compare');
  canvas.style.setProperty('--split','50%');
  canvas.innerHTML=`
    <span class="badge badge-before">Before</span>
    <span class="badge badge-after">After</span>
    <img class="art" src="${src}" alt="logo before">
    <div class="after-wrap"><img class="art" id="after-art" src="${src}" alt="logo after"></div>
    <div class="split-line"></div>
    <div class="split-handle" id="split-handle">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 6 3 12 9 18"/><polyline points="15 6 21 12 15 18"/></svg>
    </div>
    <div class="proc"><div><div class="spin"></div><div class="proc-t">Working…</div></div></div>`;
  $('[data-act="undo"]').disabled=true;   // nothing to undo until a tool runs
  wireSlider();
}

/* ============================================================
   REMOVE BACKGROUND — 100% client-side (no API key / no backend)
   Flood-fills the connected background inward from every border,
   keying on the border colour with a tolerance, then feathers the
   1px edge so it doesn't look cut out. Great for logos on solid /
   simple backgrounds; struggles on busy photos (that'd want an AI
   service — easy to swap in later at the marked spot).
   ============================================================ */
const RBG_TOLERANCE=32;      // colour match radius (0-255-ish)
const RBG_MAXDIM=1600;       // cap working resolution for responsiveness

function removeBackground(src){
  return new Promise((resolve,reject)=>{
    const img=new Image();
    img.onload=()=>{
      try{
        let {width:w,height:h}=img;
        const scale=Math.min(1,RBG_MAXDIM/Math.max(w,h));
        w=Math.round(w*scale); h=Math.round(h*scale);
        const cv=document.createElement('canvas'); cv.width=w; cv.height=h;
        const ctx=cv.getContext('2d',{willReadFrequently:true});
        ctx.drawImage(img,0,0,w,h);
        const id=ctx.getImageData(0,0,w,h), d=id.data, N=w*h;

        // reference bg colour = average of the four corners
        const corners=[0,(w-1),(h-1)*w,(h*w-1)];
        let rr=0,gg=0,bb=0;
        corners.forEach(p=>{const i=p*4;rr+=d[i];gg+=d[i+1];bb+=d[i+2];});
        rr/=4; gg/=4; bb/=4;
        const tol2=RBG_TOLERANCE*RBG_TOLERANCE*3;
        const near=i=>{const dr=d[i]-rr,dg=d[i+1]-gg,db=d[i+2]-bb;return dr*dr+dg*dg+db*db<=tol2;};

        // flood fill from all border pixels (iterative stack)
        const visited=new Uint8Array(N), stack=[];
        for(let x=0;x<w;x++){stack.push(x);stack.push(x+(h-1)*w);}
        for(let y=0;y<h;y++){stack.push(y*w);stack.push(w-1+y*w);}
        while(stack.length){
          const p=stack.pop();
          if(visited[p]) continue;
          visited[p]=1;
          if(!near(p*4)) continue;
          d[p*4+3]=0;                       // clear alpha = transparent bg
          const x=p%w, y=(p/w)|0;
          if(x>0)   stack.push(p-1);
          if(x<w-1) stack.push(p+1);
          if(y>0)   stack.push(p-w);
          if(y<h-1) stack.push(p+w);
        }

        // 1px edge feather — soften alpha where opaque meets transparent
        const out=new Uint8ClampedArray(d);
        for(let y=0;y<h;y++)for(let x=0;x<w;x++){
          const p=(y*w+x), a=d[p*4+3];
          if(a===0) continue;
          let clear=0,tot=0;
          for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){
            const nx=x+dx,ny=y+dy; if(nx<0||ny<0||nx>=w||ny>=h) continue;
            tot++; if(d[(ny*w+nx)*4+3]===0) clear++;
          }
          if(clear>0) out[p*4+3]=Math.round(a*(1-clear/tot*0.8));
        }
        ctx.putImageData(new ImageData(out,w,h),0,0);
        resolve(cv.toDataURL('image/png'));
      }catch(err){ reject(err); }
    };
    img.onerror=()=>reject(new Error('image load failed'));
    img.src=src;
  });
}

function setProcessing(on){
  state.processing=on;
  canvas.classList.toggle('is-processing',on);
}

async function runRemoveBG(){
  if(!state.hasImage) return toast('Upload a logo first');
  if(state.processing) return;
  if(!state.compare){ state.compare=true; canvas.classList.remove('no-compare'); }
  canvas.style.setProperty('--split','50%');
  setProcessing(true);
  toast('Removing background…');
  try{
    const result=await removeBackground(state.original);
    state.result=result;
    const after=$('#after-art'); if(after) after.src=result;
    $('[data-act="undo"]').disabled=false;
    toast('<b>Background removed</b> — drag the slider to compare');
  }catch(err){
    console.error(err);
    toast('Couldn\'t process that image');
  }finally{ setProcessing(false); }
}

function doUndo(){
  if(!state.result) return;
  state.result=null;
  const after=$('#after-art'); if(after) after.src=state.original;
  $('[data-act="undo"]').disabled=true;
  toast('Reverted to original');
}

/* ---- Export: download the current result (transparent PNG if BG removed) ---- */
function doExport(){
  if(!state.hasImage) return toast('Upload a logo first');
  const src=state.result||state.original;
  const a=document.createElement('a');
  a.href=src;
  a.download=state.result?'gang-sheet-logo-transparent.png':'gang-sheet-logo.png';
  document.body.appendChild(a); a.click(); a.remove();
  toast('<b>Exported</b> — check your downloads');
}
function resetCanvas(){
  state.hasImage=false; state.compare=false; state.original=null; state.result=null;
  setProcessing(false);
  canvas.classList.add('no-compare');
  canvas.innerHTML=`
    <span class="badge badge-before">Before</span>
    <span class="badge badge-after">After</span>
    <div class="canvas-empty" id="canvas-empty">
      <svg class="ce-ico" width="46" height="46" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="m21 15-5-5L5 21"/></svg>
      <div class="ce-t">Drop your logo</div>
      <div class="ce-s">PNG · JPG · SVG — up to 30MB</div>
      <label class="ce-btn" for="file-input">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
        Upload Logo
      </label>
      <input type="file" id="file-input" accept="image/*" hidden/>
    </div>`;
  $('[data-act="undo"]').disabled=true;
  wireFileInput();
}
function toggleCompare(){
  if(!state.hasImage) return toast('Upload a logo first');
  state.compare=!state.compare;
  canvas.classList.toggle('no-compare',!state.compare);
  if(state.compare){canvas.style.setProperty('--split','50%');}
  toast(state.compare?'Compare <b>on</b>':'Compare <b>off</b>');
}

function wireSlider(){
  const handle=$('#split-handle');
  if(!handle) return;
  let drag=false;
  const move=clientX=>{
    const r=canvas.getBoundingClientRect();
    let p=((clientX-r.left)/r.width)*100;
    p=Math.max(0,Math.min(100,p));
    canvas.style.setProperty('--split',p+'%');
  };
  const start=e=>{drag=true;e.preventDefault();};
  const end=()=>{drag=false;};
  handle.addEventListener('pointerdown',start);
  canvas.addEventListener('pointerdown',e=>{ if(state.compare){move(e.clientX);start(e);} });
  window.addEventListener('pointermove',e=>{ if(drag) move(e.clientX); });
  window.addEventListener('pointerup',end);
}

/* ---- file input + drag/drop ---- */
function readFile(file){
  if(!file||!file.type.startsWith('image/')) return toast('Please choose an image file');
  const rd=new FileReader();
  rd.onload=()=>{ loadImage(rd.result); toast('<b>Logo loaded</b> — drag the slider'); };
  rd.readAsDataURL(file);
}
function wireFileInput(){
  const inp=$('#file-input');
  if(inp) inp.addEventListener('change',e=>readFile(e.target.files[0]));
}
wireFileInput();

// drag & drop anywhere on the canvas
['dragover','dragenter'].forEach(ev=>canvas.addEventListener(ev,e=>{e.preventDefault();}));
canvas.addEventListener('drop',e=>{
  e.preventDefault();
  if(e.dataTransfer.files&&e.dataTransfer.files[0]) readFile(e.dataTransfer.files[0]);
});
</script>
